<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>실시간 통역 마이크</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 28px 20px 40px;
      background: #0f1419;
      color: #f2f5f8;
      font-family: "Apple SD Gothic Neo", "Pretendard", sans-serif;
    }
    main { max-width: 420px; margin: 0 auto; }
    h1 { margin: 0 0 8px; font-size: 1.6rem; letter-spacing: -0.03em; }
    p { line-height: 1.45; }
    .hint { color: #9aa8b8; font-size: 0.95rem; }
    label { display: block; font-weight: 700; margin: 18px 0 8px; }
    input {
      width: 100%;
      padding: 14px 12px;
      border-radius: 12px;
      border: 1px solid #334155;
      background: #121a24;
      color: #f2f5f8;
      font: inherit;
      font-size: 1.05rem;
    }
    button {
      width: 100%;
      margin-top: 14px;
      padding: 14px 16px;
      border: 0;
      border-radius: 12px;
      background: #1f8f6a;
      color: white;
      font: inherit;
      font-weight: 800;
      font-size: 1.05rem;
    }
    button:disabled { opacity: 0.45; }
    #status { min-height: 3em; font-weight: 700; }
    .meter { height: 10px; margin-top: 16px; border-radius: 99px; background: #121a24; overflow: hidden; }
    .meter span { display: block; height: 100%; width: 0%; background: #7dcea0; }
  </style>
</head>
<body>
  <main>
    <h1>실시간 통역 마이크</h1>
    <p class="hint">이 휴대폰 마이크가 송출 컴퓨터의 입력 채널이 됩니다. 먼저 이름을 정하고, 그다음 마이크를 엽니다.</p>
    <form id="nameForm">
      <label for="name">이름</label>
      <input id="name" name="name" maxlength="40" autocomplete="name" enterkeyhint="done" required>
      <button type="submit">다음</button>
    </form>
    <div id="micStep" hidden>
      <p id="who"></p>
      <button type="button" id="openMic">마이크 열기</button>
    </div>
    <p id="status"></p>
    <div class="meter" aria-hidden="true"><span id="level"></span></div>
  </main>
  <script>
/*__PCM16__*/
    const statusEl = document.getElementById("status");
    const nameForm = document.getElementById("nameForm");
    const micStep = document.getElementById("micStep");
    const openMic = document.getElementById("openMic");
    const levelEl = document.getElementById("level");
    const storageKey = "liveInterpretPhoneId";
    let displayName = "";
    let phoneId = localStorage.getItem(storageKey) || "";
    let socket = null;
    let audioContext = null;
    let processor = null;
    let mediaStream = null;
    let listening = false;
    let reconnectTimer = null;

    function say(text) { statusEl.textContent = text; }

    function securePage() {
      return window.isSecureContext === true && location.protocol === "https:";
    }

    function rememberPhone(id) {
      if (!id) return;
      phoneId = id;
      localStorage.setItem(storageKey, id);
    }

    nameForm.addEventListener("submit", (event) => {
      event.preventDefault();
      if (!securePage()) {
        say("이 주소는 보안 페이지가 아니라서 마이크를 열 수 없습니다. 송출 컴퓨터의 https 참여 주소로 다시 여세요.");
        return;
      }
      displayName = nameForm.name.value.trim();
      if (!displayName) {
        say("이름을 입력해 주세요.");
        return;
      }
      document.getElementById("who").textContent = displayName;
      nameForm.hidden = true;
      micStep.hidden = false;
      say("마이크를 열면 이 이름이 송출 컴퓨터의 입력 채널에 표시됩니다.");
    });

    function downsample(float32, inputRate) {
      return downsampleFloatToPcm16(float32, inputRate, 24000);
    }

    function sendLevel(float32) {
      let peak = 0;
      for (let i = 0; i < float32.length; i += 32) {
        const value = Math.abs(float32[i]);
        if (value > peak) peak = value;
      }
      levelEl.style.width = `${Math.max(0, Math.min(100, Math.round(peak * 140)))}%`;
    }

    function connectSocket() {
      if (socket && (socket.readyState === WebSocket.OPEN || socket.readyState === WebSocket.CONNECTING)) return;
      const ws = new WebSocket(`wss://${location.host}/mic`);
      socket = ws;
      ws.binaryType = "arraybuffer";
      ws.addEventListener("open", () => {
        ws.send(JSON.stringify({ type: "hello", name: displayName, phoneId }));
      });
      ws.addEventListener("message", (event) => {
        if (typeof event.data !== "string") return;
        let message = null;
        try { message = JSON.parse(event.data); } catch (_) { return; }
        if (!message || typeof message !== "object") return;
        if (message.type === "joined") {
          rememberPhone(message.phoneId);
          say(listening
            ? "마이크를 송출 컴퓨터로 보내는 중입니다."
            : "송출 컴퓨터에 연결되었습니다. 송출 컴퓨터에서 이 입력을 켜면 말하기가 방송에 들어갑니다.");
        } else if (message.type === "state") {
          listening = !!message.listening;
          say(listening
            ? "마이크를 송출 컴퓨터로 보내는 중입니다."
            : "송출 컴퓨터에 연결되었습니다. 송출 컴퓨터에서 이 입력을 켜면 말하기가 방송에 들어갑니다.");
        } else if (message.type === "error") {
          say(message.message || "연결하지 못했습니다.");
        }
      });
      ws.addEventListener("close", () => {
        if (socket !== ws) return;
        socket = null;
        if (!displayName) return;
        say("송출 컴퓨터와 연결이 끊겼습니다. 다시 연결합니다.");
        clearTimeout(reconnectTimer);
        reconnectTimer = setTimeout(connectSocket, 1500);
      });
    }

    openMic.addEventListener("click", async () => {
      if (!securePage() || !navigator.mediaDevices || typeof navigator.mediaDevices.getUserMedia !== "function") {
        say("이 주소는 보안 페이지가 아니라서 마이크를 열 수 없습니다. 송출 컴퓨터의 https 참여 주소로 다시 여세요.");
        return;
      }
      openMic.disabled = true;
      try {
        mediaStream = await navigator.mediaDevices.getUserMedia({
          audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true },
          video: false,
        });
        audioContext = new AudioContext();
        await audioContext.resume();
        const source = audioContext.createMediaStreamSource(mediaStream);
        processor = audioContext.createScriptProcessor(4096, 1, 1);
        processor.onaudioprocess = (event) => {
          const input = event.inputBuffer.getChannelData(0);
          sendLevel(input);
          if (!socket || socket.readyState !== WebSocket.OPEN) return;
          const pcm = downsample(input, audioContext.sampleRate);
          if (!pcm.length || socket.bufferedAmount > 262144) return;
          socket.send(pcm);
        };
        source.connect(processor);
        processor.connect(audioContext.destination);
        connectSocket();
        say("마이크를 열었습니다. 송출 컴퓨터에 연결하는 중입니다.");
      } catch (err) {
        openMic.disabled = false;
        const name = err && err.name;
        if (name === "NotAllowedError" || name === "PermissionDeniedError") {
          say("마이크 권한이 없습니다. 브라우저 설정에서 마이크를 허용해 주세요.");
        } else if (name === "NotFoundError") {
          say("이 휴대폰에서 마이크를 찾지 못했습니다.");
        } else if (name === "SecurityError") {
          say("이 주소는 보안 페이지가 아니라서 마이크를 열 수 없습니다. 송출 컴퓨터의 https 참여 주소로 다시 여세요.");
        } else {
          say("마이크를 열지 못했습니다.");
        }
      }
    });

    if (!securePage()) {
      say("이 주소는 보안 페이지가 아니라서 마이크를 열 수 없습니다. 송출 컴퓨터의 https 참여 주소로 다시 여세요.");
      nameForm.querySelector("button").disabled = true;
    }
  </script>
</body>
</html>
