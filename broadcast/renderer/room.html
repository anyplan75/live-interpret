<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>방송실</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <div>
      <h1>방송실</h1>
      <p class="hint" id="lead">마이크와 휴대폰을 연결합니다. 시작, 언어, 충전금은 설정 앱에서 다룹니다.</p>
    </div>
  </header>
  <main>
    <section class="card" id="signInCard">
      <h2>로그인</h2>
      <p class="hint">이 방송실과 설정 앱은 같은 계정으로 로그인합니다.</p>
      <label for="email">이메일</label>
      <input id="email" type="email" autocomplete="username">
      <label for="password">비밀번호</label>
      <input id="password" type="password" autocomplete="current-password">
      <button type="button" id="signIn">로그인</button>
      <p class="hint" id="signInMsg"></p>
    </section>

    <section id="studio" hidden>
      <section class="card">
        <h2>이 컴퓨터</h2>
        <p class="hint" id="accountLine"></p>
        <p class="hint">기록은 이 컴퓨터 폴더에만 남습니다.</p>
        <button type="button" class="ghost" id="pickFolder">기록 폴더</button>
        <p class="hint" id="folderLine">폴더를 아직 고르지 않았습니다.</p>
        <button type="button" class="ghost" id="openSettings">설정 앱 열기</button>
        <button type="button" class="ghost" id="signOut">로그아웃</button>
      </section>

      <section class="card" id="inputCard">
        <h2>마이크</h2>
        <div class="row">
          <select id="device" class="grow"></select>
          <button type="button" class="ghost" id="reloadDevices">장치 새로고침</button>
        </div>
        <div id="meters"></div>
      </section>

      <section class="card" id="phoneJoinCard">
        <h2>휴대폰</h2>
        <p class="hint">연결 번호와 QR만 보여 줍니다. 휴대폰 수는 통역 설정 페이지에서 고릅니다. 휴대폰에서 이름과 말하는 언어를 입력합니다.</p>
        <div id="phoneDesks"></div>
        <p class="hint" id="phoneMsg"></p>
      </section>
    </section>
  </main>
  <script src="room.js"></script>
</body>
</html>
