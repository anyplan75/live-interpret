<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta http-equiv="Cache-Control" content="no-cache">
  <title>실시간 통역 마이크</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 28px 20px 40px;
      background: #0f1419;
      color: #f2f5f8;
      font-family: "Apple SD Gothic Neo", "Pretendard", sans-serif;
    }
    main { max-width: 420px; margin: 0 auto; }
    h1 { margin: 0 0 8px; font-size: 1.6rem; letter-spacing: -0.03em; }
    p { line-height: 1.45; }
    .hint { color: #9aa8b8; font-size: 0.95rem; }
    label { display: block; font-weight: 700; margin: 18px 0 8px; }
    input {
      width: 100%;
      padding: 14px 12px;
      border-radius: 12px;
      border: 1px solid #334155;
      background: #121a24;
      color: #f2f5f8;
      font: inherit;
      font-size: 1.05rem;
    }
    button {
      width: 100%;
      margin-top: 14px;
      padding: 14px 16px;
      border: 0;
      border-radius: 12px;
      background: #1f8f6a;
      color: white;
      font: inherit;
      font-weight: 800;
      font-size: 1.05rem;
    }
    button:disabled { opacity: 0.45; }
    #status { min-height: 3em; font-weight: 700; }
    .meter { height: 10px; margin-top: 16px; border-radius: 99px; background: #121a24; overflow: hidden; }
    .meter span { display: block; height: 100%; width: 0%; background: #7dcea0; }
  </style>
</head>
<body>
  <main>
    <h1>실시간 통역 마이크</h1>
    <p class="hint">이 휴대폰 마이크가 송출 컴퓨터의 입력 채널이 됩니다. 같은 Wi-Fi에서 이름을 입력하고 마이크를 여세요. 추가 설치는 없습니다.</p>
    <form id="micForm">
      <label for="name">이름</label>
      <input id="name" name="name" maxlength="40" autocomplete="name" enterkeyhint="done" required>
      <button type="submit" id="openMic">마이크 열기</button>
    </form>
    <p id="status"></p>
    <div class="meter" aria-hidden="true"><span id="level"></span></div>
  </main>
  <script>
    function floatSampleToInt16(value) {
      const sample = Math.max(-1, Math.min(1, Number(value) || 0));
      return sample < 0 ? Math.round(sample * 32768) : Math.round(sample * 32767);
    }

    function downsampleFloatToPcm16(float32, inputRate, outputRate) {
      const input = float32 || [];
      const inRate = Number(inputRate) || 0;
      const outRate = Number(outputRate) || 0;
      if (!input.length || inRate <= 0 || outRate <= 0) return new Int16Array(0);
      const outLength = inRate === outRate
        ? input.length
        : Math.floor(input.length * outRate / inRate);
      if (outLength <= 0) return new Int16Array(0);
      const out = new Int16Array(outLength);
      if (inRate === outRate) {
        for (let i = 0; i < input.length; i += 1) out[i] = floatSampleToInt16(input[i]);
        return out;
      }
      const ratio = inRate / outRate;
      let offset = 0;
      for (let i = 0; i < outLength; i += 1) {
        const next = Math.min(input.length, Math.max(offset + 1, Math.round((i + 1) * ratio)));
        let sum = 0;
        let count = 0;
        for (let j = offset; j < next; j += 1) {
          sum += input[j];
          count += 1;
        }
        offset = next;
        out[i] = floatSampleToInt16(count ? sum / count : 0);
      }
      return out;
    }

    const databaseURL = "https://live-interpret-db65e-default-rtdb.asia-southeast1.firebasedatabase.app";
    const rootPath = "live-interpret";
    const statusEl = document.getElementById("status");
    const form = document.getElementById("micForm");
    const openMic = document.getElementById("openMic");
    const levelEl = document.getElementById("level");
    const storageKey = "liveInterpretPhoneId";
    const params = new URLSearchParams(location.search);
    const sessionToken = params.get("s") || "";
    let displayName = "";
    let phoneId = localStorage.getItem(storageKey) || "";
    let audioContext = null;
    let processor = null;
    let mediaStream = null;
    let listening = false;
    let active = null;
    let reconnectTimer = null;

    function say(text) { statusEl.textContent = text; }

    function securePage() {
      return window.isSecureContext === true && location.protocol === "https:";
    }

    function validToken(value) {
      return /^[a-f0-9]{32}$/.test(value || "");
    }

    function randomHex(bytes) {
      const list = new Uint8Array(bytes);
      crypto.getRandomValues(list);
      return Array.from(list, (item) => item.toString(16).padStart(2, "0")).join("");
    }

    function rememberPhone(id) {
      if (!/^[A-Za-z0-9_-]{8,64}$/.test(id || "")) return;
      phoneId = id;
      localStorage.setItem(storageKey, id);
    }

    function sendLevel(float32) {
      let peak = 0;
      for (let i = 0; i < float32.length; i += 32) {
        const value = Math.abs(float32[i]);
        if (value > peak) peak = value;
      }
      levelEl.style.width = `${Math.max(0, Math.min(100, Math.round(peak * 140)))}%`;
    }

    function applySignal(link, path, data) {
      const parts = String(path || "/").split("/").filter(Boolean);
      if (!parts.length && data && typeof data === "object") {
        if (data.answer && data.answer.sdp) link.takeAnswer(data.answer.sdp);
        if (data.macIce && typeof data.macIce === "object") {
          Object.entries(data.macIce).forEach(([id, value]) => link.takeIce(id, value));
        }
        return;
      }
      if (parts[0] === "answer" && data && data.sdp) link.takeAnswer(data.sdp);
      if (parts[0] === "macIce") {
        if (parts.length === 1 && data && typeof data === "object") {
          Object.entries(data).forEach(([id, value]) => link.takeIce(id, value));
        } else if (parts.length === 2) link.takeIce(parts[1], data);
      }
    }

    function watchSignal(link, peerUrl) {
      const source = new EventSource(peerUrl);
      const onEvent = (event) => {
        let payload = null;
        try { payload = JSON.parse(event.data); } catch (_) { return; }
        if (!payload) return;
        applySignal(link, payload.path, payload.data);
      };
      source.addEventListener("put", onEvent);
      source.addEventListener("patch", onEvent);
      const timer = setInterval(async () => {
        try {
          const res = await fetch(peerUrl, { cache: "no-store" });
          if (!res.ok) return;
          applySignal(link, "/", await res.json());
        } catch (_) { /* 다음 주기에서 다시 읽습니다 */ }
      }, 1000);
      return () => {
        clearInterval(timer);
        source.close();
      };
    }

    async function putJson(url, body) {
      const res = await fetch(url, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
        cache: "no-store",
      });
      if (!res.ok) throw new Error("signal");
    }

    function describeJoined(isListening) {
      return isListening
        ? "마이크를 송출 컴퓨터로 보내는 중입니다."
        : "송출 컴퓨터에 연결되었습니다. 송출 컴퓨터에서 이 입력을 켜면 말하기가 방송에 들어갑니다.";
    }

    function startLink() {
      if (active) return;
      const peerId = randomHex(16);
      const base = `${databaseURL}/${rootPath}/phoneLinks/${sessionToken}/peers/${peerId}`;
      const pc = new RTCPeerConnection({
        iceServers: [{ urls: "stun:stun.l.google.com:19302" }],
        bundlePolicy: "max-bundle",
      });
      const channel = pc.createDataChannel("mic");
      channel.binaryType = "arraybuffer";
      const link = {
        pc,
        channel,
        answered: false,
        iceSeen: new Set(),
        iceQueue: [],
        stopWatch: () => {},
        async takeAnswer(sdp) {
          if (this.answered || typeof sdp !== "string" || !sdp) return;
          this.answered = true;
          await pc.setRemoteDescription({ type: "answer", sdp });
          const queued = this.iceQueue.splice(0);
          for (const ice of queued) {
            try { await pc.addIceCandidate(ice); } catch (_) { /* 늦은 후보는 무시합니다 */ }
          }
        },
        takeIce(iceId, value) {
          if (this.iceSeen.has(iceId) || typeof value !== "string") return;
          let body = null;
          try { body = JSON.parse(value); } catch (_) { return; }
          if (!body || typeof body.candidate !== "string" || !body.candidate) return;
          if (/\btyp relay\b/.test(body.candidate)) return;
          this.iceSeen.add(iceId);
          const ice = {
            candidate: body.candidate,
            sdpMid: body.sdpMid || "0",
            sdpMLineIndex: Number.isInteger(body.sdpMLineIndex) ? body.sdpMLineIndex : 0,
          };
          if (!this.answered) {
            this.iceQueue.push(ice);
            return;
          }
          pc.addIceCandidate(ice).catch(() => {});
        },
      };
      active = link;
      channel.onopen = () => {
        channel.send(JSON.stringify({ type: "hello", name: displayName, phoneId }));
        say("송출 컴퓨터에 연결하는 중입니다.");
      };
      channel.onmessage = (event) => {
        if (typeof event.data !== "string") return;
        let message = null;
        try { message = JSON.parse(event.data); } catch (_) { return; }
        if (!message || typeof message !== "object") return;
        if (message.type === "joined") {
          rememberPhone(message.phoneId);
          say(describeJoined(listening));
        } else if (message.type === "state") {
          listening = !!message.listening;
          say(describeJoined(listening));
        } else if (message.type === "error") {
          say(message.message || "연결하지 못했습니다.");
        }
      };
      channel.onclose = () => {
        if (active !== link) return;
        link.stopWatch();
        try { pc.close(); } catch (_) { /* 이미 닫힌 연결은 무시합니다 */ }
        active = null;
        if (!displayName) return;
        say("송출 컴퓨터와 연결이 끊겼습니다. 다시 연결합니다.");
        clearTimeout(reconnectTimer);
        reconnectTimer = setTimeout(startLink, 1500);
      };
      pc.onicecandidate = (event) => {
        if (!event.candidate || !event.candidate.candidate) return;
        if (/\btyp relay\b/.test(event.candidate.candidate)) return;
        const payload = JSON.stringify({
          candidate: event.candidate.candidate,
          sdpMid: event.candidate.sdpMid,
          sdpMLineIndex: event.candidate.sdpMLineIndex,
        });
        if (payload.length > 2000) return;
        putJson(`${base}/phoneIce/${randomHex(8)}.json`, payload).catch(() => {});
      };
      link.stopWatch = watchSignal(link, `${base}.json`);
      pc.createOffer().then(async (offer) => {
        await pc.setLocalDescription(offer);
        await putJson(`${base}/offer.json`, { type: "offer", sdp: offer.sdp });
      }).catch(() => {
        say("송출 컴퓨터와 연결하지 못했습니다. QR을 다시 스캔해 주세요.");
      });
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      if (!validToken(sessionToken)) {
        say("송출 컴퓨터에 나온 QR을 다시 스캔해 주세요.");
        return;
      }
      if (!securePage() || !navigator.mediaDevices || typeof navigator.mediaDevices.getUserMedia !== "function") {
        say("이 페이지는 보안 연결이 아니라서 마이크를 열 수 없습니다.");
        return;
      }
      displayName = form.name.value.trim();
      if (!displayName) {
        say("이름을 입력해 주세요.");
        return;
      }
      openMic.disabled = true;
      try {
        if (!audioContext) audioContext = new AudioContext();
        await audioContext.resume();
        if (!mediaStream) {
          mediaStream = await navigator.mediaDevices.getUserMedia({
            audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true },
            video: false,
          });
          const source = audioContext.createMediaStreamSource(mediaStream);
          const mute = audioContext.createGain();
          mute.gain.value = 0;
          const sendInput = (input) => {
            sendLevel(input);
            const current = active && active.channel;
            if (!current || current.readyState !== "open") return;
            const pcm = downsampleFloatToPcm16(input, audioContext.sampleRate, 24000);
            if (!pcm.length || current.bufferedAmount > 262144) return;
            current.send(pcm.buffer);
          };
          try {
            await audioContext.audioWorklet.addModule("pcm-worklet.js");
            const node = new AudioWorkletNode(audioContext, "pcm-capture");
            node.port.onmessage = (audioEvent) => sendInput(audioEvent.data);
            source.connect(node);
            node.connect(mute);
          } catch (_) {
            processor = audioContext.createScriptProcessor(4096, 1, 1);
            processor.onaudioprocess = (audioEvent) => sendInput(audioEvent.inputBuffer.getChannelData(0));
            source.connect(processor);
            processor.connect(mute);
          }
          mute.connect(audioContext.destination);
        }
        startLink();
        say("마이크를 열었습니다. 송출 컴퓨터에 연결하는 중입니다.");
      } catch (err) {
        openMic.disabled = false;
        const name = err && err.name;
        if (name === "NotAllowedError" || name === "PermissionDeniedError") {
          say("마이크 권한이 없습니다. 브라우저 설정에서 마이크를 허용해 주세요.");
        } else if (name === "NotFoundError") {
          say("이 휴대폰에서 마이크를 찾지 못했습니다.");
        } else {
          say("마이크를 열지 못했습니다.");
        }
      }
    });

    if (!validToken(sessionToken)) {
      say("송출 컴퓨터에 나온 QR을 다시 스캔해 주세요.");
      openMic.disabled = true;
    } else if (!securePage()) {
      say("이 페이지는 보안 연결이 아니라서 마이크를 열 수 없습니다.");
      openMic.disabled = true;
    }
  </script>
</body>
</html>
