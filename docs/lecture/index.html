<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="강연·회의">
  <meta name="theme-color" content="#5b2d8e">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-192.png">
  <title>강연·회의 통역</title>
  <link rel="stylesheet" href="../css/phone-app.css">
</head>
<body>
  <main>
    <h1>강연·회의 통역</h1>
    <p class="hint" id="lead">송출 컴퓨터에 나온 QR을 스캔한 뒤, 이름과 말하는 언어를 입력하세요.</p>

    <section id="booth" class="card">
      <div id="needScan">
        <button type="button" id="scanQr">QR 스캔</button>
      </div>
      <form id="micForm" hidden>
        <label for="name">이름</label>
        <input id="name" name="name" maxlength="40" autocomplete="name" enterkeyhint="next" required>
        <label for="spoken">말하는 언어</label>
        <select id="spoken" name="spoken" required></select>
        <button type="submit" id="openMic">마이크 열기</button>
      </form>
      <p id="status"></p>
      <div class="meter" aria-hidden="true"><span id="level"></span></div>
    </section>

    <p class="hint install">아이폰은 공유 단추에서 홈 화면에 추가합니다. 안드로이드는 브라우저 메뉴에서 설치하거나 홈 화면에 추가합니다.</p>
  </main>
  <script src="../js/languages.js"></script>
  <script src="../js/catalog.js"></script>
  <script src="../js/org-services.js"></script>
  <script src="../js/pcm-browser.js"></script>
  <script>
/**
 * 휴대폰이 보내는 WebRTC 마이크.
 * 강연·회의 앱과 대면 통역의 상대 휴대폰이 같은 신호(phoneLinks)를 씁니다.
 */
(function (root) {
  const LI = root.LI = root.LI || {};

  function randomHex(bytes) {
    const list = new Uint8Array(bytes);
    crypto.getRandomValues(list);
    return Array.from(list, (item) => item.toString(16).padStart(2, "0")).join("");
  }

  function rememberPhone(id) {
    if (!/^[A-Za-z0-9_-]{8,64}$/.test(id || "")) return "";
    try { localStorage.setItem("liveInterpretPhoneId", id); } catch (_) { /* 저장이 막혀도 이번 연결은 유지합니다 */ }
    return id;
  }

  function storedPhone() {
    try { return localStorage.getItem("liveInterpretPhoneId") || ""; } catch (_) { return ""; }
  }

  function applySignal(link, path, data) {
    const parts = String(path || "/").split("/").filter(Boolean);
    if (!parts.length && data && typeof data === "object") {
      if (data.answer && data.answer.sdp) link.takeAnswer(data.answer.sdp);
      if (data.macIce && typeof data.macIce === "object") {
        Object.entries(data.macIce).forEach(([id, value]) => link.takeIce(id, value));
      }
      return;
    }
    if (parts[0] === "answer" && data && data.sdp) link.takeAnswer(data.sdp);
    if (parts[0] === "macIce") {
      if (parts.length === 1 && data && typeof data === "object") {
        Object.entries(data).forEach(([id, value]) => link.takeIce(id, value));
      } else if (parts.length === 2) link.takeIce(parts[1], data);
    }
  }

  function watchSignal(link, peerUrl) {
    const source = new EventSource(peerUrl);
    const onEvent = (event) => {
      let payload = null;
      try { payload = JSON.parse(event.data); } catch (_) { return; }
      if (!payload) return;
      applySignal(link, payload.path, payload.data);
    };
    source.addEventListener("put", onEvent);
    source.addEventListener("patch", onEvent);
    const timer = setInterval(async () => {
      try {
        const res = await fetch(peerUrl, { cache: "no-store" });
        if (!res.ok) return;
        applySignal(link, "/", await res.json());
      } catch (_) { /* 다음 주기에서 다시 읽습니다 */ }
    }, 1000);
    return () => {
      clearInterval(timer);
      source.close();
    };
  }

  function numericCandidate(value) {
    const host = (root.LIJoin && root.LIJoin.localAddress) || root.__liLocalAddress || "";
    if (typeof value !== "string" || !/^\d{1,3}(?:\.\d{1,3}){3}$/.test(host)) return value;
    return value.replace(/\b[A-Za-z0-9-]+\.local\b/g, host);
  }

  async function putJson(url, body) {
    const res = await fetch(url, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
      cache: "no-store",
    });
    if (!res.ok) throw new Error("signal");
  }

  async function open(opts) {
    const options = opts || {};
    const token = options.token || "";
    const name = options.name || "";
    if (!/^[a-f0-9]{32}$/.test(token)) throw new Error("연결 토큰이 올바르지 않습니다.");
    if (!name) throw new Error("이름을 입력해 주세요.");
    const databaseURL = String(options.databaseURL || "").replace(/\/$/, "");
    const rootPath = options.rootPath || "live-interpret";
    const onStatus = options.onStatus || (() => {});
    const onJson = options.onJson || (() => {});
    const onLevel = options.onLevel || (() => {});
    let phoneId = storedPhone();
    let sending = true;
    let audioContext = options.audioContext || null;
    let mediaStream = null;
    let active = null;
    let reconnectTimer = null;
    let closed = false;
    let refused = false;
    const pin = String(options.pin || "");

    if (!audioContext) audioContext = new AudioContext();
    await audioContext.resume();
    mediaStream = await navigator.mediaDevices.getUserMedia({
      audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true },
      video: false,
    });
    const source = audioContext.createMediaStreamSource(mediaStream);
    // 출력을 0으로 두면 아이폰이 마이크 처리를 멈춰, 연결만 되고 소리가 안 간다.
    const sink = audioContext.createMediaStreamDestination();
    const sendInput = (input) => {
      let peak = 0;
      for (let i = 0; i < input.length; i += 32) {
        const value = Math.abs(input[i]);
        if (value > peak) peak = value;
      }
      onLevel(Math.max(0, Math.min(100, Math.round(peak * 140))));
      if (!sending) return;
      const current = active && active.channel;
      if (!current || current.readyState !== "open") return;
      const pcm = LI.pcm.downsampleFloatToPcm16(input, audioContext.sampleRate, 24000);
      if (!pcm.length || current.bufferedAmount > 262144) return;
      const copy = pcm.slice();
      try { current.send(copy.buffer); } catch (_) { /* 한 조각이 실패해도 다음 소리는 계속 보냅니다 */ }
    };
    const workletSource = [
      "class PcmCapture extends AudioWorkletProcessor {",
      "  process(inputs) {",
      "    const channel = inputs[0] && inputs[0][0];",
      "    if (channel && channel.length) this.port.postMessage(channel.slice(0));",
      "    return true;",
      "  }",
      "}",
      "registerProcessor('pcm-capture', PcmCapture);",
    ].join("\n");
    try {
      const workletUrl = options.workletUrl || URL.createObjectURL(new Blob([workletSource], { type: "application/javascript" }));
      await audioContext.audioWorklet.addModule(workletUrl);
      const node = new AudioWorkletNode(audioContext, "pcm-capture");
      node.port.onmessage = (audioEvent) => sendInput(audioEvent.data);
      source.connect(node);
      node.connect(sink);
    } catch (_) {
      const processor = audioContext.createScriptProcessor(4096, 1, 1);
      processor.onaudioprocess = (audioEvent) => sendInput(audioEvent.inputBuffer.getChannelData(0));
      source.connect(processor);
      processor.connect(sink);
    }

    // 마이크 자체는 스피커로 보내지 않는다. 아주 작은 반복 소리만 출력해,
    // 화면이 꺼져도 아이폰이 이 마이크 처리를 멈추지 않게 한다.
    let keepAlive = null;
    function startKeepAlive() {
      if (closed || keepAlive || !audioContext) return;
      const rate = audioContext.sampleRate || 48000;
      const buffer = audioContext.createBuffer(1, rate, rate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < data.length; i += 1) data[i] = i % 2 === 0 ? 0.01 : -0.01;
      const quiet = audioContext.createBufferSource();
      quiet.buffer = buffer;
      quiet.loop = true;
      const gain = audioContext.createGain();
      gain.gain.value = 0.00001;
      quiet.connect(gain);
      gain.connect(audioContext.destination);
      quiet.start();
      keepAlive = quiet;
    }
    async function hold() {
      if (closed || !audioContext) return;
      try { await audioContext.resume(); } catch (_) { /* 화면이 꺼진 뒤에도 다음 유지에서 다시 엽니다 */ }
      startKeepAlive();
    }
    await hold();

    function startLink() {
      if (closed || active) return;
      const peerId = randomHex(16);
      const base = `${databaseURL}/${rootPath}/phoneLinks/${token}/peers/${peerId}`;
      const pc = new RTCPeerConnection({
        iceServers: [{ urls: "stun:stun.l.google.com:19302" }],
        bundlePolicy: "max-bundle",
      });
      const channel = pc.createDataChannel("mic");
      channel.binaryType = "arraybuffer";
      const link = {
        pc,
        channel,
        answered: false,
        iceSeen: new Set(),
        iceQueue: [],
        stopWatch: () => {},
        async takeAnswer(sdp) {
          if (this.answered || typeof sdp !== "string" || !sdp) return;
          this.answered = true;
          await pc.setRemoteDescription({ type: "answer", sdp });
          const queued = this.iceQueue.splice(0);
          for (const ice of queued) {
            try { await pc.addIceCandidate(ice); } catch (_) { /* 늦은 후보는 무시합니다 */ }
          }
        },
        takeIce(iceId, value) {
          if (this.iceSeen.has(iceId) || typeof value !== "string") return;
          let body = null;
          try { body = JSON.parse(value); } catch (_) { return; }
          if (!body || typeof body.candidate !== "string" || !body.candidate) return;
          if (/\btyp relay\b/.test(body.candidate)) return;
          this.iceSeen.add(iceId);
          const ice = {
            candidate: body.candidate,
            sdpMid: body.sdpMid || "0",
            sdpMLineIndex: Number.isInteger(body.sdpMLineIndex) ? body.sdpMLineIndex : 0,
          };
          if (!this.answered) {
            this.iceQueue.push(ice);
            return;
          }
          pc.addIceCandidate(ice).catch(() => {});
        },
      };
      active = link;
      channel.onopen = () => {
        const hello = { type: "hello", name, phoneId, pin, role: options.role || "mic" };
        if (options.spoken) hello.spoken = String(options.spoken);
        if (options.connectionId) hello.connectionId = String(options.connectionId);
        channel.send(JSON.stringify(hello));
        onStatus("연결하는 중입니다.");
      };
      channel.onmessage = (event) => {
        if (typeof event.data !== "string") return;
        let message = null;
        try { message = JSON.parse(event.data); } catch (_) { return; }
        if (!message || typeof message !== "object") return;
        if (message.type === "joined") {
          phoneId = rememberPhone(message.phoneId) || phoneId;
          onStatus("연결되었습니다.");
        } else if (message.type === "error") {
          refused = true;
          onStatus(message.message || "연결하지 못했습니다.");
          try { pc.close(); } catch (_) { /* 거절된 연결은 닫습니다 */ }
        }
        onJson(message);
      };
      channel.onclose = () => {
        if (active !== link) return;
        link.stopWatch();
        try { pc.close(); } catch (_) { /* 이미 닫힌 연결은 무시합니다 */ }
        active = null;
        if (closed || refused) return;
        onStatus("연결이 끊겼습니다. 다시 연결합니다.");
        clearTimeout(reconnectTimer);
        reconnectTimer = setTimeout(startLink, 1500);
      };
      pc.onicecandidate = (event) => {
        if (!event.candidate || !event.candidate.candidate) return;
        if (/\btyp relay\b/.test(event.candidate.candidate)) return;
        const payload = JSON.stringify({
          candidate: numericCandidate(event.candidate.candidate),
          sdpMid: event.candidate.sdpMid,
          sdpMLineIndex: event.candidate.sdpMLineIndex,
        });
        if (payload.length > 2000) return;
        putJson(`${base}/phoneIce/${randomHex(8)}.json`, payload).catch(() => {});
      };
      link.stopWatch = watchSignal(link, `${base}.json`);
      pc.createOffer().then(async (offer) => {
        await pc.setLocalDescription(offer);
        await putJson(`${base}/offer.json`, { type: "offer", sdp: numericCandidate(offer.sdp) });
      }).catch(() => {
        onStatus("연결하지 못했습니다. 다시 시도해 주세요.");
      });
    }

    startLink();
    return {
      setPaused(next) { sending = !next; },
      hold,
      stop() {
        closed = true;
        clearTimeout(reconnectTimer);
        if (keepAlive) {
          try { keepAlive.stop(); } catch (_) { /* 이미 멈춘 유지 소리는 무시합니다 */ }
          keepAlive = null;
        }
        if (active) {
          active.stopWatch();
          try { active.pc.close(); } catch (_) { /* 이미 닫힌 연결은 무시합니다 */ }
        }
        active = null;
        if (mediaStream) mediaStream.getTracks().forEach((track) => track.stop());
        if (typeof options.onStop === "function") options.onStop();
      },
    };
  }

  LI.phoneOffer = { open, randomHex };
})(typeof globalThis !== "undefined" ? globalThis : this);

</script>
  <script src="sw-register.js"></script>
  <script>
    const statusEl = document.getElementById("status");
    const levelEl = document.getElementById("level");
    const openMic = document.getElementById("openMic");
    const spokenEl = document.getElementById("spoken");
    const needScan = document.getElementById("needScan");
    const micForm = document.getElementById("micForm");
    let link = null;
    let slot = null;

    function say(text) { statusEl.textContent = text; }
    function fillSpoken() {
      spokenEl.innerHTML = "";
      (LI.catalog.languages || []).forEach((lang) => {
        const option = document.createElement("option");
        option.value = lang.code;
        option.textContent = `${lang.flag} ${lang.name}`;
        spokenEl.append(option);
      });
      if (LI.catalog.langByCode.ko) spokenEl.value = "ko";
    }
    function securePage() {
      return window.isSecureContext === true && (location.protocol === "https:" || location.hostname === "localhost" || location.hostname === "127.0.0.1");
    }

    document.getElementById("scanQr").addEventListener("click", () => {
      const bridge = window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.scanLecture;
      if (bridge) bridge.postMessage("scan");
      else say("휴대폰 앱에서 QR 스캔을 눌러 주세요.");
    });

    function showSlot(next) {
      slot = next;
      needScan.hidden = true;
      micForm.hidden = false;
      say("이름과 말하는 언어를 입력한 뒤 마이크를 여세요.");
    }

    function readSlot(connectionId, token) {
      const id = String(connectionId || "").trim().toUpperCase();
      const signal = String(token || "").trim().toLowerCase();
      if (!/^[ABCDEFGHJKLMNPQRSTUVWXYZ23456789]{6}$/.test(id)) return null;
      if (!/^[a-f0-9]{32}$/.test(signal)) return null;
      return { connectionId: id, token: signal };
    }

    function notifyMic(state) {
      const bridge = window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.lectureMic;
      if (bridge) bridge.postMessage(state);
    }

    window.LIJoin = {
      applyScan(payload) {
        const parsed = readSlot(payload && payload.connectionId, payload && payload.token);
        if (!parsed) {
          say("이 QR은 강연 참여 QR이 아닙니다.");
          return false;
        }
        showSlot(parsed);
        return true;
      },
      holdMic() {
        if (link && typeof link.hold === "function") link.hold();
      },
      setLocalAddress(ip) {
        if (typeof ip !== "string" || !/^\d{1,3}(?:\.\d{1,3}){3}$/.test(ip)) return;
        this.localAddress = ip;
        window.__liLocalAddress = ip;
      },
    };

    document.addEventListener("visibilitychange", () => {
      if (window.LIJoin && window.LIJoin.holdMic) window.LIJoin.holdMic();
    });

    try { fillSpoken(); } catch (_) { /* 언어 목록이 늦게 와도 스캔 단추는 동작합니다 */ }
    try {
      const fromPage = LI.orgServices && LI.orgServices.parseLectureSlot && LI.orgServices.parseLectureSlot(location.href);
      if (fromPage) showSlot(fromPage);
    } catch (_) { /* 주소에 칸 정보가 없어도 스캔으로 들어옵니다 */ }

    document.getElementById("micForm").addEventListener("submit", async (event) => {
      event.preventDefault();
      if (!slot) {
        say("먼저 QR을 스캔해 주세요.");
        return;
      }
      if (link) link.stop();
      link = null;
      const name = LI.orgServices.cleanName(document.getElementById("name").value);
      if (!name) {
        say("이름을 입력해 주세요.");
        return;
      }
      const spoken = spokenEl.value;
      if (!spoken || !LI.catalog.langByCode[spoken]) {
        say("말하는 언어를 선택해 주세요.");
        return;
      }
      if (!securePage() || !navigator.mediaDevices || typeof navigator.mediaDevices.getUserMedia !== "function") {
        say("이 페이지는 보안 연결이 아니라서 마이크를 열 수 없습니다.");
        return;
      }
      openMic.disabled = true;
      try {
        let current = null;
        current = await LI.phoneOffer.open({
          databaseURL: LI.catalog.firebase.databaseURL,
          rootPath: LI.catalog.firebase.rootPath,
          token: slot.token,
          name,
          spoken,
          connectionId: slot.connectionId,
          role: "lecture",
          onStop() { notifyMic("stop"); },
          onStatus: say,
          onLevel(width) { levelEl.style.width = `${width}%`; },
          onJson(message) {
            if (!message || message.type !== "error" || !current) return;
            current.stop();
            current = null;
            link = null;
            openMic.disabled = false;
          },
        });
        link = current;
        notifyMic("open");
        say("마이크를 열었습니다. 송출 컴퓨터에 연결하는 중입니다.");
      } catch (err) {
        openMic.disabled = false;
        const code = err && err.name;
        if (code === "NotAllowedError" || code === "PermissionDeniedError") {
          say("마이크 권한이 없습니다. 설정에서 마이크를 허용해 주세요.");
        } else {
          say(err && err.message ? err.message : "마이크를 열지 못했습니다.");
        }
      }
    });
  </script>
</body>
</html>
