<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="강연·회의">
  <meta name="theme-color" content="#5b2d8e">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-192.png">
  <title>강연·회의 통역</title>
  <link rel="stylesheet" href="../css/phone-app.css">
</head>
<body>
  <main>
    <h1>강연·회의 통역</h1>
    <p class="hint">진행자가 알려 준 암호와 이름을 입력하면 이 휴대폰이 송출 컴퓨터의 마이크가 됩니다. 이 암호는 계정 비밀번호가 아닙니다.</p>

    <section id="booth" class="card">
      <form id="micForm">
        <label for="joinId">암호</label>
        <input id="joinId" name="joinId" maxlength="8" autocapitalize="characters" autocomplete="off" enterkeyhint="next" required>
        <label for="name">이름</label>
        <input id="name" name="name" maxlength="40" autocomplete="name" enterkeyhint="done" required>
        <button type="submit" id="openMic">마이크 열기</button>
      </form>
      <p id="status"></p>
      <div class="meter" aria-hidden="true"><span id="level"></span></div>
    </section>

    <p class="hint install">아이폰은 공유 단추에서 홈 화면에 추가합니다. 안드로이드는 브라우저 메뉴에서 설치하거나 홈 화면에 추가합니다.</p>
  </main>
  <script src="../js/languages.js"></script>
  <script src="../js/catalog.js"></script>
  <script src="../js/org-services.js"></script>
  <script src="../js/pcm-browser.js"></script>
  <script src="../js/phone-offer.js"></script>
  <script src="sw-register.js"></script>
  <script>
    const statusEl = document.getElementById("status");
    const levelEl = document.getElementById("level");
    const openMic = document.getElementById("openMic");
    let link = null;

    function say(text) { statusEl.textContent = text; }
    function securePage() {
      return window.isSecureContext === true && (location.protocol === "https:" || location.hostname === "localhost" || location.hostname === "127.0.0.1");
    }

    async function lookupToken(connectionId) {
      const url = `${LI.catalog.firebase.databaseURL.replace(/\/$/, "")}/${LI.catalog.firebase.rootPath}/lectureJoins/${connectionId}.json`;
      const res = await fetch(url);
      if (!res.ok) throw new Error("암호를 확인하지 못했습니다. 잠시 뒤에 다시 시도해 주세요.");
      const row = await res.json();
      if (!row || !LI.orgServices.validToken(row.token)) {
        throw new Error("암호를 확인하거나, 진행자가 시작했는지 확인해 주세요.");
      }
      return row.token;
    }

    document.getElementById("micForm").addEventListener("submit", async (event) => {
      event.preventDefault();
      if (link) link.stop();
      link = null;
      const connectionId = LI.orgServices.normalizeConnectionId(document.getElementById("joinId").value);
      const name = LI.orgServices.cleanName(document.getElementById("name").value);
      if (!connectionId) {
        say("암호를 확인해 주세요.");
        return;
      }
      if (!name) {
        say("이름을 입력해 주세요.");
        return;
      }
      if (!securePage() || !navigator.mediaDevices || typeof navigator.mediaDevices.getUserMedia !== "function") {
        say("이 페이지는 보안 연결이 아니라서 마이크를 열 수 없습니다.");
        return;
      }
      openMic.disabled = true;
      try {
        const token = await lookupToken(connectionId);
        let current = null;
        current = await LI.phoneOffer.open({
          databaseURL: LI.catalog.firebase.databaseURL,
          rootPath: LI.catalog.firebase.rootPath,
          token,
          name,
          spoken: "ko",
          connectionId,
          role: "lecture",
          onStatus: say,
          onLevel(width) { levelEl.style.width = `${width}%`; },
          onJson(message) {
            if (!message || message.type !== "error" || !current) return;
            current.stop();
            current = null;
            link = null;
            openMic.disabled = false;
          },
        });
        link = current;
        say("마이크를 열었습니다. 송출 컴퓨터에 연결하는 중입니다.");
      } catch (err) {
        openMic.disabled = false;
        const code = err && err.name;
        if (code === "NotAllowedError" || code === "PermissionDeniedError") {
          say("마이크 권한이 없습니다. 설정에서 마이크를 허용해 주세요.");
        } else {
          say(err && err.message ? err.message : "마이크를 열지 못했습니다.");
        }
      }
    });
  </script>
</body>
</html>
