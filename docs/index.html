<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>실시간 통역</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <div class="container">
    <header class="brand">
      <div class="church" id="churchName">실시간 통역</div>
      <div class="sub" id="churchSub">오늘 송출 중인 언어를 고르면 자막이 열립니다.</div>
    </header>
    <section class="card" id="missing" hidden>
      <h2>교회 링크가 필요합니다</h2>
      <p class="hint">성도 화면은 관리자가 보낸 교회 주소로 열어야 합니다.</p>
    </section>
    <section class="card" id="langsCard">
      <h2>나의 통역</h2>
      <div class="lang-grid" id="langGrid"></div>
    </section>
    <p class="hint"><a href="admin.html">관리</a></p>
  </div>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
  <script src="js/languages.js"></script>
  <script src="js/catalog.js"></script>
  <script src="js/db.js"></script>
  <script src="js/viewer.js"></script>
  <script>
    const churchId = LI.catalog.churchIdFromQuery(location.search);
    const grid = document.getElementById("langGrid");
    const missing = document.getElementById("missing");
    const langsCard = document.getElementById("langsCard");

    function render(codes) {
      const allow = new Set(codes);
      const langs = LI.catalog.languages.filter((lang) => allow.has(lang.code));
      grid.innerHTML = langs.map((lang) => `
        <a class="lang-link" href="listen.html?church=${encodeURIComponent(churchId)}&lang=${encodeURIComponent(lang.code)}">
          <span class="flag">${lang.flag}</span>
          <span>${lang.name}</span>
          <span class="hint">${lang.nameEn}</span>
        </a>
      `).join("");
    }

    if (!churchId) {
      missing.hidden = false;
      langsCard.hidden = true;
    } else {
      LI.db.useChurch(churchId);
      render(["ko", ...LI.catalog.defaultSelectedTargets()]);
      LI.db.init().then(async () => {
        const name = await LI.db.get(`churches/${churchId}/name`);
        if (name) {
          document.getElementById("churchName").textContent = name;
          document.title = `${name} 실시간 통역`;
        }
        LI.db.onValue("settings", (settings) => {
          render(LI.viewer.activeLangCodesFromSettings(settings));
        });
      }).catch((err) => {
        document.getElementById("churchSub").textContent = err.message || "연결에 실패했습니다.";
      });
    }
  </script>
</body>
</html>
