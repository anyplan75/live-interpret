<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OBS 오버레이</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  <link rel="stylesheet" href="css/overlay.css">
</head>
<body>
  <div id="container" class="layout-bottom">
    <div id="subtitle">자막 대기 중...</div>
  </div>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
  <script src="js/languages.js"></script>
  <script src="js/catalog.js"></script>
  <script src="js/db.js"></script>
  <script src="js/viewer.js"></script>
  <script>
    const churchId = LI.catalog.churchIdFromQuery(location.search);
    const subtitle = document.getElementById("subtitle");
    if (!churchId) {
      subtitle.textContent = "교회 링크가 없습니다.";
    } else {
      const lang = LI.viewer.queryLang("ko");
      document.title = `Overlay (${lang})`;
      LI.db.useChurch(churchId);
      let overlay = null;
      LI.db.init().then(() => {
        LI.db.onValue(`churches/${churchId}/active`, (value) => {
          if (!LI.catalog.churchIsActive(value)) {
            if (overlay) {
              overlay.stop();
              overlay = null;
            }
            subtitle.textContent = "이 교회는 지금 통역을 사용하지 않습니다.";
            return;
          }
          if (!overlay) {
            overlay = LI.viewer.startOverlay({
              lang,
              container: document.getElementById("container"),
              subtitle,
            });
          }
        });
      }).catch((err) => {
        subtitle.textContent = LI.catalog.redactSecrets(err.message || "연결 실패");
      });
    }
  </script>
</body>
</html>
