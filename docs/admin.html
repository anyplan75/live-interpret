<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>통역 관리</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <div class="container">
    <header class="brand">
      <div class="church">통역 관리</div>
      <div class="sub">로그인한 관리자만 키, 교회, 용어집, 자막 기록을 보거나 바꿉니다.</div>
    </header>
    <p id="banner" class="error"></p>

    <section class="card stack" id="gate">
      <h2 id="gateTitle">관리자 로그인</h2>
      <p id="gateHint" class="hint">계정을 확인하고 있습니다.</p>
      <label for="email">이메일</label>
      <input id="email" type="email" autocomplete="username" required>
      <label for="password">비밀번호</label>
      <input id="password" type="password" autocomplete="current-password" required>
      <div id="confirmWrap" hidden>
        <label for="confirm">비밀번호 확인</label>
        <input id="confirm" type="password" autocomplete="new-password">
      </div>
      <div class="row" style="margin-top:12px;">
        <button type="button" id="gateSubmit">로그인</button>
      </div>
      <p id="gateMsg" class="msg"></p>
    </section>

    <div id="adminApp" hidden>
    <div class="row" style="justify-content:flex-end;">
      <button type="button" class="ghost" id="signOut">로그아웃</button>
    </div>

    <section class="card">
      <h2>OpenAI 키</h2>
      <p class="hint">교회마다 키를 두지 않습니다. 여기에 한 번 저장하면 방송 앱이 그 키로 번역합니다.</p>
      <label for="apiKey">API 키</label>
      <input id="apiKey" type="password" autocomplete="off" placeholder="한 번만 입력">
      <div class="row" style="margin-top:8px;">
        <button type="button" id="saveKey">키 저장</button>
      </div>
      <p id="keyMsg" class="msg"></p>
    </section>

    <section class="card">
      <h2>교회 추가</h2>
      <div class="row">
        <input id="churchName" type="text" placeholder="교회 이름" maxlength="80">
        <button type="button" id="addChurch">추가</button>
      </div>
      <p class="hint">추가하면 성도 페이지, 자막, OBS 링크가 만들어집니다. 방송실 PC에서는 송출 앱을 설치하고 이 교회를 고릅니다.</p>
    </section>

    <section class="card">
      <h2>교회</h2>
      <div id="churchList" class="church-list"></div>
    </section>

    <section class="card" id="detail" hidden>
      <h2 id="detailTitle">교회</h2>
      <label for="editName">교회 이름</label>
      <input id="editName" type="text" maxlength="80">
      <div class="row" style="margin-top:12px;">
        <button type="button" id="toggleActive">비활성화</button>
        <span id="activeState" class="hint"></span>
      </div>
      <div id="links"></div>
      <label for="glossary" style="margin-top:16px;">예배 용어집</label>
      <textarea id="glossary"></textarea>
      <div class="row" style="margin-top:8px;">
        <button type="button" id="saveGlossary">이름·용어집 저장</button>
        <button type="button" class="ghost" id="resetGlossary">기본 용어로 되돌리기</button>
      </div>
      <p id="saveMsg" class="msg"></p>

      <h2 style="margin-top:22px;">OBS 글자</h2>
      <div class="settings-grid">
        <label>배치
          <select id="layout">
            <option value="bottom">아래</option>
            <option value="top">위</option>
            <option value="left">왼쪽</option>
            <option value="right">오른쪽</option>
          </select>
        </label>
        <label>정렬
          <select id="align">
            <option value="left">왼쪽</option>
            <option value="center">가운데</option>
            <option value="right">오른쪽</option>
          </select>
        </label>
        <label>글자색 <input id="color" type="color" value="#ffffff"></label>
        <label>배경색 <input id="bgColor" type="color" value="#000000"></label>
        <label>투명도 <input id="opacity" type="number" min="0" max="1" step="0.1" value="0.7"></label>
      </div>
      <div id="fontRows"></div>
      <button type="button" id="saveStyle" style="margin-top:10px;">자막 모양 저장</button>

      <h2 style="margin-top:22px;">저장된 방송</h2>
      <div id="sessions" class="session-list"></div>
      <div id="texts"></div>
    </section>
    </div>
  </div>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
  <script src="js/languages.js"></script>
  <script src="js/catalog.js"></script>
  <script src="js/db.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
